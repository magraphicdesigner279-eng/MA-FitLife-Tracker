<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>MA FitLife Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: single-column phone app, 480px max, fixed 5-tab bar, bottom sheets for input.
   Look: deep navy with violet bloom, neon green action color, pastel stat tiles, one light panel on the water screen. */
:root{
  --bg:#0a1030; --card:rgba(16,27,78,.74); --card2:#16245f; --line:rgba(140,162,255,.17);
  --fg:#f2f5ff; --muted:#9facd8; --lime:#37e45d; --lime2:#b8f23c; --ink:#04200d;
  --water:#2f8cff; --heart:#ff4d6d; --flame:#ff8a2a; --violet:#8b5cf6; --teal:#14c8b4; --amber:#f5b82e;
  --light:#eaf1ff; --lightfg:#0d1b4a;
  --f-display:'Sora','Plus Jakarta Sans',system-ui,sans-serif;
  --f-body:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; font-family:var(--f-body); font-size:15px; line-height:1.4; color:var(--fg);
  background-color:var(--bg);
  background-image:radial-gradient(120% 55% at 15% -8%,#3447d2 0%,rgba(52,71,210,0) 62%),radial-gradient(90% 50% at 105% 28%,#5b36c4 0%,rgba(91,54,196,0) 58%),linear-gradient(#0b1236,#091029);
  background-repeat:no-repeat; min-height:100vh;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--lime2);outline-offset:2px}
h1,h2,h3,p{margin:0}
.app{max-width:480px;margin:0 auto;padding-block:10px 118px;display:flex;flex-direction:column;gap:16px}
.ic{display:block;flex:none}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* brand */
.brand{display:flex;align-items:center;gap:14px;padding-top:4px}
.logo{position:relative;width:78px;height:78px;flex:none;border-radius:50%;padding:3px;background:conic-gradient(from 200deg,#b8f23c,#37e45d,#14c8b4,#b8f23c);animation:glow 2.6s ease-in-out infinite}
.logo img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;border:3px solid #0a1030;background:#0a1030}
.bname{display:flex;flex-direction:column;min-width:0}
.bname .l1,.bname .l2{font:800 27px/1.05 var(--f-display);white-space:nowrap;letter-spacing:-.2px}
.bname .l2{color:var(--lime)}
.bname .tag{margin-top:4px;color:var(--muted);font-weight:600;font-size:12.5px}
.ch{display:inline-block}
.brand.play .logo{animation:logoIn 1.1s cubic-bezier(.2,1.3,.4,1) both,glow 2.6s ease-in-out 1.2s infinite}
.brand.play .ch{opacity:0;animation:chIn .5s ease-out both;animation-delay:calc(.75s + var(--i)*55ms)}
.brand.play .tag{opacity:0;animation:fadeIn .7s ease-out 2s both}
@keyframes logoIn{0%{transform:translateY(-90px) scale(.3) rotate(-30deg);opacity:0}55%{opacity:1;transform:translateY(8px) scale(1.08) rotate(5deg)}80%{transform:translateY(-3px) scale(.98) rotate(-1deg)}100%{transform:none;opacity:1}}
@keyframes chIn{from{opacity:0;transform:translateY(16px) scale(.7)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(55,228,93,.5)}50%{box-shadow:0 0 0 11px rgba(55,228,93,0)}}
@media (prefers-reduced-motion:reduce){.logo,.brand.play .logo{animation:none}.brand.play .ch,.brand.play .tag{animation:none;opacity:1}}
.av{overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;display:block}

/* header */
.top{display:flex;align-items:center;gap:12px;padding-top:6px}
.av{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font:800 22px var(--f-display);color:var(--ink);background:linear-gradient(135deg,#b8f23c,#37e45d);border:2px solid rgba(255,255,255,.5);flex:none}
.hi{min-width:0;flex:1}
.hi h1{font:800 21px var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hi p{color:var(--lime2);font-weight:600;font-size:13px}
.iconbtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.08);border:1px solid var(--line);flex:none}
.bar-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:6px}
.bar-top h1{font:700 19px var(--f-display);text-align:center;flex:1}
.bar-top .iconbtn{background:none;border-color:transparent}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sec-h h2{font:700 18px var(--f-display)}
.link{color:#6ab0ff;font-weight:700;font-size:13px;min-height:32px;display:inline-flex;align-items:center}

.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;padding:16px;border-radius:26px;background:linear-gradient(135deg,#0f6a3d 0%,#0e4a5f 62%,#13306b 100%);border:1px solid rgba(55,228,93,.3)}
.ring{position:relative;flex:none}
.ring-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring-in b{font:800 27px var(--f-display);line-height:1.1}
.ring-in small{color:#d3dcff;font-size:12px}
.hstats{display:flex;flex-direction:column;gap:14px;min-width:0}
.hs{display:flex;align-items:center;gap:10px}
.hs b{font:800 22px var(--f-display);display:block;line-height:1.1}
.hs small{color:#cfe0ff;font-size:12px}

.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{border-radius:20px;padding:14px 8px;min-height:104px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#0b1a4a;text-align:center}
.tile b{font:800 24px var(--f-display);line-height:1.1}
.tile b em{font:600 13px var(--f-body);font-style:normal;margin-left:2px}
.tile small{font-weight:600;font-size:12px;opacity:.8}
.t-water{background:#bfe0ff}.t-heart{background:#ffc9d8}.t-work{background:#d9c9ff}

.goalcard{background:#f3f6ff;color:#0d1b4a;border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px}
.goalcard .row{display:flex;align-items:center;gap:10px}
.goalcard h3{font:800 17px var(--f-display);flex:1}
.goalcard .pct{font:800 17px var(--f-display)}
.bar{height:11px;border-radius:99px;background:#d6def2;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#2fd957,#b8f23c)}
.goalcard p{font-weight:600;font-size:13px;color:#3a4a82}

.tk{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tk button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px;border-radius:18px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:12.5px;min-height:92px}
.tk .dot{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:#fff}
.note{display:flex;gap:10px;align-items:center;padding:11px 14px;border-radius:16px;background:rgba(245,184,46,.12);border:1px solid rgba(245,184,46,.35);color:#ffe3a0;font-size:13px}
.note button{color:#ffd166;font-weight:800;text-decoration:underline;min-height:32px}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;min-height:54px;border-radius:17px;font:800 16px var(--f-body);padding:12px 16px}
.btn.green{background:linear-gradient(180deg,#43f06a,#1fc24a);color:var(--ink);box-shadow:0 8px 22px rgba(55,228,93,.28)}
.btn.blue{background:linear-gradient(180deg,#3a98ff,#1b63e0);color:#fff;box-shadow:0 8px 22px rgba(47,140,255,.3)}
.btn.red{background:linear-gradient(180deg,#ff5d7a,#e0294d);color:#fff}
.btn.ghost{background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--fg)}
.btn.small{min-height:44px;font-size:14px;border-radius:14px}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:8px 14px;border-radius:99px;background:rgba(255,255,255,.08);border:1px solid var(--line);font-weight:700;font-size:13px}
.chip[aria-pressed="true"]{background:var(--lime);color:var(--ink);border-color:var(--lime)}
.lightp .chip{background:#fff;border-color:#c9d6f3;color:#16285f}
.lightp .chip[aria-pressed="true"]{background:#1b63e0;color:#fff;border-color:#1b63e0}

/* water */
.gauge{position:relative;width:min(100%,260px);margin:0 auto}
.gauge svg{width:100%;height:auto;display:block}
.gauge-in{position:absolute;left:0;right:0;top:20%;display:flex;flex-direction:column;align-items:center;text-align:center}
.gauge-in b{font:800 46px var(--f-display);line-height:1}
.gauge-in b em{font:700 24px var(--f-display);font-style:normal;margin-left:3px}
.gauge-in span{color:#d7e3ff;font-weight:600}
.gauge-in small{color:var(--muted);font-weight:600;margin-top:2px}
.lightp{background:var(--light);color:var(--lightfg);border-radius:26px;padding:16px;display:flex;flex-direction:column;gap:14px}
.lightp h2{font:800 18px var(--f-display)}
.glasses{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;text-align:center}
.glasses div{display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700;font-size:12px}
.glasses small{font-weight:600;color:#566596;font-size:11px}
.remind{display:flex;align-items:center;gap:12px;background:#d9e6ff;border-radius:18px;padding:12px 14px}
.remind .bellc{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#fff;color:#1b63e0;flex:none}
.remind div.t{flex:1;min-width:0;display:flex;flex-direction:column}
.remind strong{font-weight:800}
.remind span{font-weight:600;color:#3a4a82;font-size:13.5px}
.switch{width:54px;height:32px;border-radius:99px;background:#9bb0dd;position:relative;flex:none;transition:background .2s}
.switch i{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.switch[aria-checked="true"]{background:#1fb84a}
.switch[aria-checked="true"] i{transform:translateX(22px)}
.textbtn{color:#1b63e0;font-weight:800;font-size:13px;min-height:36px}

/* hero panels */
.panel-hero{position:relative;overflow:hidden;border-radius:26px;padding:20px 18px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line)}
.panel-hero .deco{position:absolute;right:-6px;top:6px;opacity:.9;pointer-events:none}
.panel-hero h2{font:800 30px/1.05 var(--f-display);position:relative}
.panel-hero p{font-weight:700;color:#d6e0ff;position:relative}
.ph-work{background:linear-gradient(135deg,#101b4a,#1d2c7a 55%,#3a2a8f)}
.ph-run{background:linear-gradient(180deg,#27346f 0%,#a24d6a 55%,#f08a3c 100%)}
.ph-ride{background:linear-gradient(180deg,#1b3a7a 0%,#2f7fc0 55%,#6fd0a0 100%)}
.clockbox{text-align:center;padding:6px 0;position:relative}
.clockbox b{font:800 54px var(--f-display);letter-spacing:1px;display:block;font-variant-numeric:tabular-nums}
.clockbox small{color:#e1e9ff;font-weight:700}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}
.stats3 b{font:800 22px var(--f-display);display:block;line-height:1.15}
.stats3 small{color:var(--muted);font-weight:600;font-size:12px}
.wtypes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.wt{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;font-size:12.5px;min-height:84px;border-radius:16px;padding:8px 2px;border:2px solid transparent}
.wt .sq{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;color:#fff}
.wt[aria-pressed="true"]{border-color:var(--lime);background:rgba(55,228,93,.09)}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .mid{flex:1;min-width:0}
.li b{display:block;font-weight:700}
.li small{color:var(--muted)}
.li .x{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.last{display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;align-items:center}
.last svg{width:100%;height:auto;border-radius:12px;display:block}
.last .m b{font:800 18px var(--f-display);display:block;line-height:1.3}
.last .m small{color:var(--muted)}

/* bp */
.bpbig{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.bpbig .hrt{color:var(--heart)}
.bpbig b{font:800 52px var(--f-display);line-height:1}
.bpbig small{color:var(--muted);font-weight:700}
.pill{display:inline-flex;align-items:center;gap:6px;padding:8px 20px;border-radius:99px;font-weight:800;font-size:14px}
.pill.ok{background:#17a63f;color:#fff}.pill.warn{background:#c98a0b;color:#fff}.pill.hi{background:#d9601a;color:#fff}.pill.bad{background:#d8284a;color:#fff}.pill.lo{background:#2468d8;color:#fff}
.dot-s{width:10px;height:10px;border-radius:50%;display:inline-block}
.ok-c{color:#4be07a}.warn-c{color:#ffc247}.hi-c{color:#ff9a54}.bad-c{color:#ff6b86}.lo-c{color:#6aa8ff}
.steps3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label{color:var(--muted);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.step{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.step button{height:48px;font:700 22px var(--f-body);display:grid;place-items:center}
.step input{width:100%;min-width:0;height:48px;background:none;border:0;color:var(--fg);text-align:center;font:800 18px var(--f-display);-moz-appearance:textfield}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.txt{width:100%;height:50px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid var(--line);color:var(--fg);padding:0 14px;font:700 16px var(--f-body)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);font-weight:600}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}

/* goals/stats */
.rings4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;text-align:center}
.rings4 div{display:flex;flex-direction:column;align-items:center;gap:6px}
.rings4 b{font:800 15px var(--f-display)}
.rings4 small{color:var(--muted);font-weight:600;font-size:12px}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--f-body)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:rgba(255,255,255,.07);border-radius:14px;padding:4px;border:1px solid var(--line)}
.seg button{min-height:40px;border-radius:11px;font-weight:800;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--lime);color:var(--ink)}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.kv:first-child{border-top:0}
.kv span{color:var(--muted);font-weight:600}
.kv b{font:700 16px var(--f-display);text-align:right}
.bmi{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.bmi b{font:800 30px var(--f-display)}
.bar2{height:10px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
.bar2 i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#2fd957,#b8f23c)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(8,13,42,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
.nav-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:end}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:48px;justify-content:center;color:#8c98c8;font-size:11px;font-weight:700}
.tab[aria-current="page"]{color:var(--lime)}
.plus{width:56px;height:56px;border-radius:50%;margin:-22px auto 0;display:grid;place-items:center;background:linear-gradient(180deg,#43f06a,#1fc24a);color:var(--ink);box-shadow:0 8px 22px rgba(55,228,93,.4);border:3px solid #0a1030}

/* sheet, toast, banner */
#sheet{position:fixed;inset:0;z-index:50}
.scrim{position:absolute;inset:0;background:rgba(2,6,24,.62)}
.panel{position:absolute;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:#131f55;border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;padding:20px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto;display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out}
.panel h3{font:800 20px var(--f-display)}
.panel .sub{color:var(--muted);font-weight:600;margin-top:-8px}
.qgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.qgrid button{display:flex;flex-direction:column;align-items:center;gap:7px;font-weight:700;font-size:12px;min-height:84px;text-align:center}
.qgrid .dot{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;color:#fff}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:60;background:#f2f5ff;color:#0d1b4a;font-weight:800;padding:11px 18px;border-radius:99px;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:calc(100% - 32px);text-align:center}
#banner{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);z-index:70;padding:10px max(16px,env(safe-area-inset-left,0px)) 0 max(16px,env(safe-area-inset-right,0px))}
#banner .in{max-width:480px;margin:0 auto;background:#1b63e0;color:#fff;border-radius:18px;padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
#banner .in span{flex:1;font-weight:800;min-width:0}
#banner button{background:#fff;color:#0d3a99;border-radius:12px;font-weight:800;padding:0 14px;min-height:44px;flex:none}
#banner button.x{background:rgba(255,255,255,.18);color:#fff;padding:0 12px}
@media (prefers-reduced-motion:reduce){.panel{animation:none}.switch,.switch i{transition:none}}
@media (max-width:360px){.hero{grid-template-columns:1fr;justify-items:center}.hero .hstats{flex-direction:row;gap:18px}.last{grid-template-columns:1fr}}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="gMain" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b8f23c"/><stop offset="1" stop-color="#2fd957"/></linearGradient>
    <linearGradient id="gWater" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f8cff"/><stop offset="1" stop-color="#8fdcff"/></linearGradient>
    <linearGradient id="gBar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4af07a"/><stop offset="1" stop-color="#14b5c8"/></linearGradient>

<script>
(function(){
'use strict';
var KEY='ma-fitlife-v1';
var $=function(s,r){return (r||document).querySelector(s)};

var uid=function(){return Math.random().toString(36).slice(2,9)};
var pad=function(n){return String(n).padStart(2,'0')};
var dkey=function(d){d=d||new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var keyOff=function(o){var d=new Date();d.setDate(d.getDate()-o);return dkey(d)};
var tsOff=function(o,h){var d=new Date();d.setHours(h==null?12:h,0,0,0);d.setDate(d.getDate()-o);return d.getTime()};
var nf=function(n){return Math.round(n).toLocaleString('en-US')};
var clamp=function(v,a,b){return Math.min(b,Math.max(a,v))};
var fix=function(n,d){return Number(n).toFixed(d)};

/* ---------- icons ---------- */
var P={
home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
bars:'<path d="M5 20V10M12 20V4M19 20v-7"/>',
plus:'<path d="M12 5v14M5 12h14"/>',
target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/>',
user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
drop:'<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>',
heart:'<path d="M12 20s-8-5-8-11a4.5 4.5 0 0 1 8-2.6A4.5 4.5 0 0 1 20 9c0 6-8 11-8 11z"/>',
flame:'<path d="M12 3c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-6 1-10z"/>',
dumbbell:'<path d="M6 7v10M3 10v4M18 7v10M21 10v4M6 12h12"/>',
run:'<circle cx="15" cy="5" r="2"/><path d="M5 12l4-3 4 1 3 4 3 1M9 9l-1 6-3 5M13 10l-1 5 3 2v4"/>',
bike:'<circle cx="6" cy="16" r="3.5"/><circle cx="18" cy="16" r="3.5"/><path d="M6 16l4-8h5l3 8M10 8l5 8M9 6h3"/>',
moon:'<path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/>',
bell:'<path d="M6 17v-6a6 6 0 0 1 12 0v6l2 2H4l2-2zM10 21h4"/>',
play:'<path d="M7 4l13 8-13 8z" fill="currentColor"/>',
stop:'<rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/>',
back:'<path d="M15 5l-7 7 7 7"/>',
gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',
pin:'<path d="M12 21s7-6 7-12a7 7 0 0 0-14 0c0 6 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/>',
shoe:'<path d="M3 15v-4l4-1 3 3h4l7 3v3H3z"/>',
clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
trophy:'<path d="M8 4h8v5a4 4 0 0 1-8 0V4zM8 6H4v1a4 4 0 0 0 4 4M16 6h4v1a4 4 0 0 1-4 4M12 13v4M8 20h8M10 17h4"/>',
check:'<path d="M5 12l5 5 9-10"/>',
x:'<path d="M6 6l12 12M18 6L6 18"/>',
yoga:'<circle cx="12" cy="5" r="2"/><path d="M12 8v5M5 11l7 2 7-2M8 21l4-8 4 8"/>',
bolt:'<path d="M13 3L5 14h6l-1 7 8-11h-6z"/>',
trash:'<path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/>'
};
function icon(n,s,c){s=s||22;return '<svg class="ic'+(c?' '+c:'')+'" viewBox="0 0 24 24" width="'+s+'" height="'+s+'" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+P[n]+'</svg>'}

/* ---------- state ---------- */
var S;
var ui={wtype:'Strength',range:7,metric:'steps',confirmReset:false,anim:true};
var bpDraft=null;

function seed(){
  var o={v:1,profile:{name:'Ahmad',age:28,weight:72,height:175},goals:{steps:8000,water:2500,cal:400,sleep:8},
    settings:{glass:250,remOn:true,remMin:60,sound:true},nextRem:0,active:null,
    water:[],workouts:[],sessions:[],meals:[],steps:[],sleep:{},bp:[]};
  var st=[6200,8400,7100,9300,5600,10100],wa=[1750,2250,2000,2500,1500,2250],sl=[6.5,7,7.5,6,8,7.2];
  for(var i=0;i<6;i++){
    var off=6-i;
    o.steps.push({id:uid(),t:tsOff(off,18),n:st[i],s:1});
    for(var j=0;j<Math.round(wa[i]/250);j++)o.water.push({id:uid(),t:tsOff(off,8+j),ml:250,s:1});
    o.sleep[keyOff(off)]={h:sl[i],s:1};
  }
  o.workouts.push({id:uid(),t:tsOff(5,7),type:'Strength',min:40,cal:224,s:1});
  o.workouts.push({id:uid(),t:tsOff(3,7),type:'Yoga',min:30,cal:108,s:1});
  o.workouts.push({id:uid(),t:tsOff(1,7),type:'HIIT',min:25,cal:270,s:1});
  o.sessions.push({id:uid(),t:tsOff(4,7),kind:'run',km:5.2,sec:1725,s:1});
  o.sessions.push({id:uid(),t:tsOff(2,17),kind:'ride',km:12.5,sec:2700,s:1});
  o.sessions.push({id:uid(),t:tsOff(1,6),kind:'run',km:5.1,sec:1670,s:1});
  var bp=[[118,78,70],[122,80,72],[124,82,74],[119,79,68],[126,84,75],[120,80,72]];
  bp.forEach(function(r,i){o.bp.push({id:uid(),t:tsOff(6-i,9),sys:r[0],dia:r[1],pulse:r[2],s:1})});
  return o;
}
function load(){try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);if(o&&o.v===1)return o}}catch(e){}return null}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function hasSample(){
  var f=function(a){return a.some(function(x){return x.s})};
  return f(S.water)||f(S.workouts)||f(S.sessions)||f(S.steps)||f(S.bp)||Object.keys(S.sleep).some(function(k){return S.sleep[k].s});
}
function removeSample(){
  ['water','workouts','sessions','steps','meals','bp'].forEach(function(k){S[k]=S[k].filter(function(x){return !x.s})});
  Object.keys(S.sleep).forEach(function(k){if(S.sleep[k].s)delete S.sleep[k]});
  bpDraft=null;save();
}

/* ---------- calculations ---------- */
function sameDay(t,k){return dkey(new Date(t))===k}
function sessCal(x){return Math.round(x.km*S.profile.weight*(x.kind==='run'?1:0.4))}
function totals(k){
  var t={water:0,steps:0,msteps:0,cal:0,km:0,wmin:0,wcount:0,eaten:0,sleep:S.sleep[k]?S.sleep[k].h:0,scount:0};
  S.water.forEach(function(x){if(sameDay(x.t,k))t.water+=x.ml});
  S.steps.forEach(function(x){if(sameDay(x.t,k))t.msteps+=x.n});
  S.workouts.forEach(function(x){if(sameDay(x.t,k)){t.wmin+=x.min;t.cal+=x.cal;t.wcount++}});
  S.sessions.forEach(function(x){if(sameDay(x.t,k)){t.km+=x.km;t.cal+=sessCal(x);t.scount++;if(x.kind==='run')t.steps+=Math.round(x.km*1300)}});
  S.meals.forEach(function(x){if(sameDay(x.t,k))t.eaten+=x.cal});
  t.steps+=t.msteps;
  t.km+=t.msteps*0.00075;
  return t;
}
function dailyPct(t){
  var g=S.goals;
  var p=[t.steps/g.steps,t.water/g.water,t.cal/g.cal,t.sleep/g.sleep].map(function(v){return Math.min(1,v)});
  return Math.round(p.reduce(function(a,b){return a+b},0)/4*100);
}
function classifyBP(s,d){
  if(s>180||d>120)return {label:'Crisis',cls:'bad',tx:'bad-c'};
  if(s>=140||d>=90)return {label:'High (Stage 2)',cls:'bad',tx:'bad-c'};
  if(s>=130||d>=80)return {label:'High (Stage 1)',cls:'hi',tx:'hi-c'};
  if(s>=120)return {label:'Elevated',cls:'warn',tx:'warn-c'};
  if(s<90||d<60)return {label:'Low',cls:'lo',tx:'lo-c'};
  return {label:'Normal',cls:'ok',tx:'ok-c'};
}
function latestBP(){return S.bp.slice().sort(function(a,b){return b.t-a.t})[0]}
function lastDays(n){var a=[];for(var i=n-1;i>=0;i--)a.push(keyOff(i));return a}
function wday(k){return new Date(k+'T12:00:00').toLocaleDateString('en-US',{weekday:'short'})}
function dlabel(t){return new Date(t).toLocaleDateString('en-US',{month:'short',day:'numeric'})}
function tlabel(t){return new Date(t).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}
function fmtDur(s){s=Math.max(0,Math.round(s));var h=Math.floor(s/3600),m=Math.floor(s%3600/60),r=s%60;return h?h+':'+pad(m)+':'+pad(r):pad(m)+':'+pad(r)}
function fmtPace(secPerKm){if(!isFinite(secPerKm)||secPerKm<=0)return '--:--';return Math.floor(secPerKm/60)+':'+pad(Math.round(secPerKm%60)%60)}
function fmtLit(ml){return fix(ml/1000,1)}

/* ---------- charts ---------- */
function ring(p,size,sw,stroke,inner){
  var r=(size-sw)/2,c=2*Math.PI*r,v=clamp(p,0,1),h=size/2;
  var prog=v>0.002?'<circle cx="'+h+'" cy="'+h+'" r="'+r+'" fill="none" stroke="'+stroke+'" stroke-width="'+sw+'" stroke-linecap="round" stroke-dasharray="'+(c*v).toFixed(1)+' '+c.toFixed(1)+'" transform="rotate(-90 '+h+' '+h+')"/>':'';
  return '<div class="ring" style="width:'+size+'px;height:'+size+'px"><svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" aria-hidden="true"><circle cx="'+h+'" cy="'+h+'" r="'+r+'" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="'+sw+'"/>'+prog+'</svg><div class="ring-in">'+(inner||'')+'</div></div>';
}
function gauge(p){
  var r=88,c=2*Math.PI*r,arc=c*0.75,v=clamp(p,0,1);
  var prog=v>0.002?'<circle cx="110" cy="112" r="'+r+'" fill="none" stroke="url(#gWater)" stroke-width="14" stroke-linecap="round" stroke-dasharray="'+(arc*v).toFixed(1)+' '+c.toFixed(1)+'" transform="rotate(135 110 112)"/>':'';
  return '<svg viewBox="0 0 220 190" aria-hidden="true"><circle cx="110" cy="112" r="'+r+'" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="14" stroke-linecap="round" stroke-dasharray="'+arc.toFixed(1)+' '+c.toFixed(1)+'" transform="rotate(135 110 112)"/>'+prog+'</svg>';
}
function glass(f,w){
  w=w||34;var h=Math.round(w*1.3);
  var y=40-36*f,xl=4+3*(y-4)/36,xr=30-3*(y-4)/36;
  var fill=f>0?'<polygon points="'+xl.toFixed(1)+','+y.toFixed(1)+' '+xr.toFixed(1)+','+y.toFixed(1)+' 27,40 7,40" fill="#2f8cff"/>':'';
  return '<svg viewBox="0 0 34 44" width="'+w+'" height="'+h+'" aria-hidden="true">'+fill+'<path d="M4 4h26l-3 36H7z" fill="rgba(47,140,255,.1)" stroke="#6aa8ff" stroke-width="2" stroke-linejoin="round" style="fill-opacity:'+(f>0?0:1)+'"/></svg>';
}
function barChart(vals,labels,goal,fmt){
  var W=320,H=165,pl=8,pr=8,pt=18,pb=24,n=vals.length;
  var max=Math.max(goal||0,Math.max.apply(null,vals),1)*1.08,ch=H-pt-pb,bw=(W-pl-pr)/n,bar=Math.min(24,bw*0.56),g='';
  for(var i=0;i<3;i++){var yy=pt+ch*i/2;g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+yy+'" y2="'+yy+'" stroke="rgba(255,255,255,.08)"/>'}
  if(goal){var gy=pt+ch*(1-goal/max);g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+gy+'" y2="'+gy+'" stroke="#b8f23c" stroke-dasharray="4 4" stroke-opacity=".7"/>'}
  vals.forEach(function(v,i){
    var h=Math.max(3,ch*v/max),x=pl+bw*i+(bw-bar)/2,y=H-pb-h,last=i===n-1;
    g+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bar+'" height="'+h.toFixed(1)+'" rx="5" fill="url(#gBar)" opacity="'+(last?1:0.8)+'"/>';
    if(v>0)g+='<text x="'+(x+bar/2).toFixed(1)+'" y="'+(y-4).toFixed(1)+'" text-anchor="middle" font-size="9.5" font-weight="700" fill="'+(last?'#f2f5ff':'#9facd8')+'">'+fmt(v)+'</text>';
    g+='<text x="'+(pl+bw*i+bw/2).toFixed(1)+'" y="'+(H-7)+'" text-anchor="middle" font-size="10.5" font-weight="'+(last?800:600)+'" fill="'+(last?'#f2f5ff':'#9facd8')+'">'+labels[i]+'</text>';
  });
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Bar chart">'+g+'</svg>';
}
function lineChart(series,o){
  var W=320,H=165,pl=34,pr=12,pt=12,pb=24,n=Math.max.apply(null,series.map(function(s){return s.vals.length}));
  if(n<2)return '<p class="muted" style="padding:24px 0;text-align:center">Add at least two entries to see a trend.</p>';
  var min=o.min,max=o.max,yt=o.yt||3,fmt=o.fmt||function(v){return Math.round(v)};
  var X=function(i){return pl+(W-pl-pr)*i/(n-1)},Y=function(v){return pt+(H-pt-pb)*(1-(clamp(v,min,max)-min)/(max-min))},g='';
  for(var k=0;k<=yt;k++){var val=min+(max-min)*k/yt,y=Y(val);g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="rgba(255,255,255,.08)"/><text x="'+(pl-6)+'" y="'+(y+3.5).toFixed(1)+'" text-anchor="end" font-size="10" fill="#9facd8">'+fmt(val)+'</text>'}
  series.forEach(function(s){
    var pts=[];s.vals.forEach(function(v,i){if(v!=null)pts.push([X(i),Y(v)])});
    if(!pts.length)return;
    var d=pts.map(function(p,i){return (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)}).join('');
    if(o.area){g+='<path d="'+d+'L'+pts[pts.length-1][0].toFixed(1)+' '+(H-pb)+'L'+pts[0][0].toFixed(1)+' '+(H-pb)+'Z" fill="url(#gArea)"/>'}
    g+='<path d="'+d+'" fill="none" stroke="'+s.color+'" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>';
    if(pts.length<=12)pts.forEach(function(p){g+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3" fill="#0a1030" stroke="'+s.color+'" stroke-width="2"/>'});
    var e=pts[pts.length-1];g+='<circle cx="'+e[0].toFixed(1)+'" cy="'+e[1].toFixed(1)+'" r="5" fill="'+s.color+'" stroke="#fff" stroke-width="1.5"/>';
  });
  (o.labels||[]).forEach(function(l){g+='<text x="'+X(l.i).toFixed(1)+'" y="'+(H-7)+'" text-anchor="middle" font-size="10.5" font-weight="600" fill="#9facd8">'+l.t+'</text>'});
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Line chart">'+g+'</svg>';
}
function routeSvg(id,color){
  var h=0;for(var i=0;i<id.length;i++)h=(h*31+id.charCodeAt(i))>>>0;
  var rnd=function(){h=(h*1664525+1013904223)>>>0;return h/4294967296};
  var x=14,y=44,pts=[[x,y]];
  for(var j=0;j<7;j++){x+=6+rnd()*8;y=clamp(y+(rnd()-.5)*40,12,68);pts.push([x,y])}
  var d=pts.map(function(p,i){return (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)}).join('');
  return '<svg viewBox="0 0 120 80" aria-hidden="true"><rect width="120" height="80" rx="10" fill="#dce6f4"/><path d="M0 28L120 52M32 0L52 80M86 0L72 80" stroke="#fff" stroke-width="4" fill="none"/><path d="'+d+'" stroke="'+color+'" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}

/* ---------- UI helpers ---------- */
function stepper(id,val,mn,mx,st,extra){
  return '<div class="step"><button type="button" data-act="step" data-t="'+id+'" data-d="-1" aria-label="Decrease">&minus;</button><input id="'+id+'" type="number" inputmode="decimal" value="'+val+'" min="'+mn+'" max="'+mx+'" step="'+st+'" '+(extra||'')+'><button type="button" data-act="step" data-t="'+id+'" data-d="1" aria-label="Increase">+</button></div>';
}
function sheet(html){var s=$('#sheet');s.innerHTML='<div class="scrim" data-act="closesheet"></div><div class="panel" role="dialog" aria-modal="true">'+html+'</div>';s.hidden=false}
function closeSheet(){var s=$('#sheet');s.hidden=true;s.innerHTML=''}
var toastT;
function toast(m){var t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true},2200)}
function topbar(title,right){return '<div class="bar-top"><button class="iconbtn" data-act="back" aria-label="Back">'+icon('back',24)+'</button><h1>'+title+'</h1>'+(right||'<span style="width:44px"></span>')+'</div>'}
function go(r){if(location.hash==='#'+r)render();else location.hash=r}

/* ---------- reminders ---------- */
function beep(){
  if(!S.settings.sound)return;
  try{var C=window.AudioContext||window.webkitAudioContext,c=new C(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=0.08;o.start();o.stop(c.currentTime+0.25)}catch(e){}
  try{navigator.vibrate&&navigator.vibrate(200)}catch(e){}
}
function remText(){
  if(!S.settings.remOn)return 'Reminders are off';
  var ms=Math.max(0,S.nextRem-Date.now()),m=Math.floor(ms/60000),s=Math.floor(ms/1000)%60;
  return 'Drink Water in '+(m>=1?m+' min':s+' sec');
}
function fireRem(){
  S.nextRem=Date.now()+S.settings.remMin*60000;save();beep();
  var b=$('#banner');
  b.innerHTML='<div class="in"><span>Time for a glass of water</span><button data-act="bannerAdd">+'+S.settings.glass+' ml</button><button class="x" data-act="bannerClose" aria-label="Dismiss">'+icon('x',18)+'</button></div>';
  b.hidden=false;
  try{if('Notification' in window&&Notification.permission==='granted')new Notification('MA FitLife Tracker',{body:'Time for a glass of water.'})}catch(e){}
}
function addWater(ml){
  S.water.push({id:uid(),t:Date.now(),ml:ml});
  S.nextRem=Date.now()+S.settings.remMin*60000;save();
  toast('+'+ml+' ml added');render();

  (a?'':'<div class="sec-h"><h2>Popular Workouts</h2></div><div class="wtypes">'+types.map(function(x){return '<button class="wt" data-act="wtype" data-v="'+x[0]+'" aria-pressed="'+(ui.wtype===x[0])+'"><span class="sq" style="background:'+x[2]+'">'+icon(x[1],26)+'</span>'+x[0]+'</button>'}).join('')+'</div>')+

function bp(){
  var d=bpDraft||(function(){var l=latestBP();bpDraft=l?{sys:l.sys,dia:l.dia,pulse:l.pulse}:{sys:120,dia:80,pulse:72};return bpDraft})();
  var c=classifyBP(d.sys,d.dia);
  var hist=S.bp.slice().sort(function(a,b){return a.t-b.t}).slice(-7);
  var list=S.bp.slice().sort(function(a,b){return b.t-a.t}).slice(0,5);
  var fld=function(key,label,mn,mx){return '<div class="fld"><label for="bp_'+key+'">'+label+'</label><div class="step"><button type="button" data-act="bpstep" data-k="'+key+'" data-d="-1" aria-label="Decrease '+label+'">&minus;</button><input id="bp_'+key+'" type="number" inputmode="numeric" value="'+d[key]+'" min="'+mn+'" max="'+mx+'" data-bp="'+key+'"><button type="button" data-act="bpstep" data-k="'+key+'" data-d="1" aria-label="Increase '+label+'">+</button></div></div>'};
  return topbar('Blood Pressure Tracker')+
  '<section class="card bpbig"><span class="hrt">'+icon('heart',64)+'</span><b>'+d.sys+'/'+d.dia+'</b><small>mmHg &middot; pulse '+d.pulse+' BPM</small><span class="pill '+c.cls+'">'+icon('check',16)+' '+c.label+'</span>'+(c.label==='Crisis'?'<p style="color:#ffb3c1;font-weight:600;font-size:13px">Very high. Rest, measure again, and contact a doctor or emergency service if you feel unwell.</p>':'')+'</section>'+
  '<section class="steps3">'+fld('sys','Systolic',50,260)+fld('dia','Diastolic',30,160)+fld('pulse','Pulse',30,220)+'</section>'+
  '<button class="btn blue" data-act="savebp">'+icon('heart',20)+' Save Reading</button>'+
  '<div class="sec-h"><h2>BP History</h2></div>'+
  '<section class="card"><div class="legend" style="margin-bottom:6px"><span><i style="background:#4aa3ff"></i>Systolic</span><span><i style="background:#ff6b86"></i>Diastolic</span></div>'+
  lineChart([{vals:hist.map(function(x){return x.sys}),color:'#4aa3ff'},{vals:hist.map(function(x){return x.dia}),color:'#ff6b86'}],{min:40,max:160,yt:3,labels:hist.map(function(x,i){return {i:i,t:wday(dkey(new Date(x.t)))}})})+'</section>'+
  (list.length?'<section class="card list">'+list.map(function(x){var q=classifyBP(x.sys,x.dia);return '<div class="li"><span class="dot-s" style="background:currentColor"></span><div class="mid"><b class="'+q.tx+'">'+x.sys+'/'+x.dia+' <span style="font-weight:600;font-size:13px">'+q.label+'</span></b><small>'+dlabel(x.t)+', '+tlabel(x.t)+' &middot; '+x.pulse+' BPM</small></div><button class="x" data-act="delitem" data-c="bp" data-id="'+x.id+'" aria-label="Delete reading">'+icon('trash',20)+'</button></div>'}).join('')+'</section>':'')+
  '<p class="muted" style="font-size:12.5px">For tracking only. Ranges follow the American Heart Association categories and are not medical advice.</p>';
}

var METRICS={
  steps:{l:'Steps',get:function(t){return t.steps},goal:function(){return S.goals.steps},fmt:function(v){return v>=1000?fix(v/1000,1)+'K':Math.round(v)},max:10000},
  water:{l:'Water',get:function(t){return t.water},goal:function(){return S.goals.water},fmt:function(v){return fix(v/1000,1)+'L'},max:1000},
  cal:{l:'Calories',get:function(t){return t.cal},goal:function(){return S.goals.cal},fmt:function(v){return Math.round(v)},max:100},
  sleep:{l:'Sleep',get:function(t){return t.sleep},goal:function(){return S.goals.sleep},fmt:function(v){return fix(v,1)},max:4}
};
function stats(){
  var n=ui.range,days=lastDays(n),M=METRICS[ui.metric],tt=days.map(totals),vals=tt.map(M.get);
  var chart=n===7?barChart(vals,days.map(wday),M.goal(),M.fmt):lineChart([{vals:vals,color:'#2fd9a8'}],{min:0,max:Math.max(M.goal(),Math.max.apply(null,vals))*1.1||1,yt:3,area:true,fmt:M.fmt,labels:[0,7,14,21,29].map(function(i){return {i:i,t:new Date(days[i]+'T12:00:00').getDate()}})});
  var act=function(f){var a=tt.filter(function(t){return f(t)>0});return a.length?a.reduce(function(s,t){return s+f(t)},0)/a.length:0};
  var met=vals.filter(function(v){return v>=M.goal()}).length;
  var wc=tt.reduce(function(s,t){return s+t.wcount},0),km=tt.reduce(function(s,t){return s+t.km},0);
  var bps=S.bp.filter(function(x){return days.indexOf(dkey(new Date(x.t)))>-1}),ab=bps.length?bps.reduce(function(s,x){return s+x.sys},0)/bps.length:0,ad=bps.length?bps.reduce(function(s,x){return s+x.dia},0)/bps.length:0;
  return '<div class="bar-top"><span style="width:44px"></span><h1>Health Reports</h1><span style="width:44px"></span></div>'+
  '<div class="seg" role="group" aria-label="Range"><button data-act="range" data-v="7" aria-pressed="'+(n===7)+'">7 days</button><button data-act="range" data-v="30" aria-pressed="'+(n===30)+'">30 days</button></div>'+
  '<div class="chips">'+Object.keys(METRICS).map(function(k){return '<button class="chip" data-act="metric" data-v="'+k+'" aria-pressed="'+(ui.metric===k)+'">'+METRICS[k].l+'</button>'}).join('')+'</div>'+
  '<section class="card">'+chart+'</section>'+
  '<section class="card"><div class="kv"><span>Avg steps (active days)</span><b>'+nf(act(function(t){return t.steps}))+'</b></div><div class="kv"><span>Avg water</span><b>'+fix(act(function(t){return t.water})/1000,1)+' L</b></div><div class="kv"><span>Calories burned</span><b>'+nf(tt.reduce(function(s,t){return s+t.cal},0))+' kcal</b></div><div class="kv"><span>Avg sleep</span><b>'+fix(act(function(t){return t.sleep}),1)+' h</b></div><div class="kv"><span>Workouts</span><b>'+wc+'</b></div><div class="kv"><span>Distance</span><b>'+fix(km,1)+' km</b></div><div class="kv"><span>'+M.l+' goal met</span><b>'+met+' of '+n+' days</b></div><div class="kv"><span>Avg blood pressure</span><b>'+(bps.length?Math.round(ab)+'/'+Math.round(ad):'No readings')+'</b></div></section>';
}

  return '<div class="bar-top"><span style="width:44px"></span><h1>Profile</h1><span style="width:44px"></span></div>'+
  '<section class="card" style="display:flex;flex-direction:column;gap:14px"><div style="display:flex;align-items:center;gap:14px"><div class="av" style="width:64px;height:64px"><img src="'+PHOTO+'" alt="Profile photo"></div><div class="fld" style="flex:1;min-width:0"><label for="pf_name">Name</label><input class="txt" id="pf_name" type="text" maxlength="20" value="'+esc(p.name)+'" data-prof="name"></div></div>'+
  '<div class="grid2"><div class="fld"><label for="pf_age">Age</label>'+stepper('pf_age',p.age,10,100,1,'data-prof="age"')+'</div><div class="fld"><label for="pf_weight">Weight (kg)</label>'+stepper('pf_weight',p.weight,30,250,1,'data-prof="weight"')+'</div><div class="fld"><label for="pf_height">Height (cm)</label>'+stepper('pf_height',p.height,100,230,1,'data-prof="height"')+'</div></div></section>'+
  '<section class="card" style="display:flex;flex-direction:column;gap:10px"><div class="bmi"><div><div class="muted" style="font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.06em">BMI</div><b>'+fix(bmi,1)+'</b></div><span style="font-weight:800">'+cat+'</span></div><div class="bar2"><i style="width:'+Math.round(bp*100)+'%"></i></div></section>'+
  '<section class="card" style="display:flex;flex-direction:column;gap:14px"><h2 style="font:700 18px var(--f-display)">Settings</h2>'+
  '<div class="kv" style="border:0;padding:0"><span style="color:var(--fg);font-weight:700">Water reminders</span><button class="switch" role="switch" aria-checked="'+s.remOn+'" aria-label="Water reminders" data-act="remtoggle"><i></i></button></div>'+
  '<div class="fld"><label>Remind every</label><div class="chips">'+[30,45,60,90,120].map(function(v){return '<button class="chip" data-act="setint" data-v="'+v+'" aria-pressed="'+(s.remMin===v)+'">'+v+' min</button>'}).join('')+'</div></div>'+
  '<div class="kv" style="border:0;padding:0"><span style="color:var(--fg);font-weight:700">Reminder sound</span><button class="switch" role="switch" aria-checked="'+s.sound+'" aria-label="Reminder sound" data-act="togglesound"><i></i></button></div>'+
  '<button class="btn ghost small" data-act="editgoals">Edit daily goals</button></section>'+
  '<section class="card" style="display:flex;flex-direction:column;gap:10px"><h2 style="font:700 18px var(--f-display)">Your data</h2><p class="muted" style="font-size:13px">Everything is saved in this browser on this device.</p>'+
  (hasSample()?'<button class="btn ghost small" data-act="rmsample">Remove sample data</button>':'')+
  '<button class="btn ghost small" data-act="resetall" style="'+(ui.confirmReset?'background:#e0294d;color:#fff;border-color:#e0294d':'')+'">'+(ui.confirmReset?'Tap again to erase everything':'Reset all data')+'</button></section>';
}

var ROUTES={home:home,water:water,workout:workout,running:function(){return sessionScreen('run')},cycling:function(){return sessionScreen('ride')},bp:bp,stats:stats,goals:goals,profile:profile,sleep:sleepScr,calories:caloriesScr};
function cur(){var h=(location.hash||'#home').slice(1);return ROUTES[h]?h:'home'}
function render(){
  var r=cur();
  $('#view').innerHTML=ROUTES[r]();
  ui.anim=false;
  ['home','stats','goals','profile'].forEach(function(t){var b=$('#tab-'+t);if(t===r)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
}
function navInit(){
  var L={home:['home','Home'],stats:['bars','Stats'],goals:['target','Goals'],profile:['user','Profile']};
  Object.keys(L).forEach(function(k){$('#tab-'+k).innerHTML=icon(L[k][0],24)+'<span>'+L[k][1]+'</span>'});
  $('#tab-plus').innerHTML=icon('plus',30);
}

/* ---------- sheets ---------- */
function quickSheet(){
  var q=[['drop','Water','qwater','#2f8cff'],['dumbbell','Workout','go:workout','#3d6bff'],['run','Run','go:running','#2fc455'],['bike','Ride','go:cycling','#10a896'],['heart','BP','go:bp','#e6334f'],['shoe','Steps','steps','#e89a0c'],['moon','Sleep','go:sleep','#7c4de6'],['flame','Meal','go:calories','#f2761c']];
  sheet('<h3>Quick add</h3><div class="qgrid">'+q.map(function(x){return '<button data-act="quickgo" data-q="'+x[2]+'"><span class="dot" style="background:'+x[3]+'">'+icon(x[0],24)+'</span>'+x[1]+'</button>'}).join('')+'</div>');
}
function stepsSheet(){
  sheet('<h3>Add steps</h3><p class="sub">Enter steps from your phone or watch.</p><div class="fld"><label for="st_n">Steps</label>'+stepper('st_n',1000,100,50000,100)+'</div><button class="btn green" data-act="savesteps">Add Steps</button>');
}
function goalsSheet(){
  var g=S.goals;
  sheet('<h3>Daily goals</h3><div class="grid2"><div class="fld"><label for="g_steps">Steps</label>'+stepper('g_steps',g.steps,1000,40000,500)+'</div><div class="fld"><label for="g_water">Water (ml)</label>'+stepper('g_water',g.water,500,6000,250)+'</div><div class="fld"><label for="g_cal">Calories</label>'+stepper('g_cal',g.cal,50,3000,50)+'</div><div class="fld"><label for="g_sleep">Sleep (h)</label>'+stepper('g_sleep',g.sleep,4,12,0.5)+'</div></div><button class="btn green" data-act="savegoals">Save Goals</button>');
}
function finishSheet(kind,manual){
  var a=S.active,el=a&&!manual?clamp(Math.round((Date.now()-a.start)/60000),1,300):(kind==='workout'?30:30);
  var type=a&&a.type?a.type:ui.wtype;
  if(kind==='workout'){
    var MET={Strength:5,Cardio:7,Yoga:3,HIIT:9},cal=Math.round((MET[type]||5)*S.profile.weight*el/60);
    sheet('<h3>'+esc(type)+' workout</h3><p class="sub">Check the details, then save.</p><div class="grid2"><div class="fld"><label for="f_min">Minutes</label>'+stepper('f_min',el,1,300,1)+'</div><div class="fld"><label for="f_cal">Calories</label>'+stepper('f_cal',cal,0,3000,10)+'</div></div><button class="btn green" data-act="savefinish" data-k="workout" data-type="'+esc(type)+'" data-manual="'+(manual?1:0)+'">Save Workout</button>');
  }else{
    var run=kind==='run',km=Math.round(el/60*(run?9:18)*10)/10;
    sheet('<h3>'+(run?'Run':'Ride')+' summary</h3><p class="sub">Enter the distance from your watch or bike computer. The suggestion is an estimate.</p><div class="grid2"><div class="fld"><label for="f_min">Minutes</label>'+stepper('f_min',el,1,600,1)+'</div><div class="fld"><label for="f_km">Distance (km)</label>'+stepper('f_km',km,0.1,300,0.1)+'</div></div><button class="btn green" data-act="savefinish" data-k="'+kind+'" data-manual="'+(manual?1:0)+'">Save '+(run?'Run':'Ride')+'</button>');
  }
}
function viewAll(kind){
  var l=S.sessions.filter(function(x){return x.kind===kind}).sort(function(a,b){return b.t-a.t}).slice(0,30),run=kind==='run';
  sheet('<h3>All '+(run?'runs':'rides')+'</h3>'+(l.length?'<div class="list">'+l.map(function(x){return '<div class="li"><span style="color:#b8f23c">'+icon(run?'run':'bike',22)+'</span><div class="mid"><b>'+fix(x.km,1)+' km &middot; '+fmtDur(x.sec)+'</b><small>'+dlabel(x.t)+' &middot; '+(run?fmtPace(x.sec/x.km)+' /km':fix(x.km/(x.sec/3600),1)+' km/h')+'</small></div><button class="x" data-act="delitem" data-c="sessions" data-id="'+x.id+'" data-keep="'+kind+'" aria-label="Delete">'+icon('trash',20)+'</button></div>'}).join('')+'</div>':'<p class="muted">Nothing logged yet.</p>')+'<button class="btn ghost small" data-act="closesheet">Close</button>');
}

/* ---------- events ---------- */
function startActive(kind){
  if(S.active){toast('Finish your current session first');return}
  S.active={kind:kind,type:kind==='workout'?ui.wtype:null,start:Date.now()};save();render();
}
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.dataset.act,d=b.dataset;
  switch(a){
    case 'go':closeSheet();go(d.to);break;
    case 'back':go('home');break;
    case 'closesheet':closeSheet();break;
    case 'quick':quickSheet();break;
    case 'quickgo':
      closeSheet();
      if(d.q==='qwater')addWater(S.settings.glass);
      else if(d.q==='steps')stepsSheet();
      else go(d.q.slice(3));
      break;
    case 'bell':toast(remText());break;
    case 'step':{
      var inp=document.getElementById(d.t);if(!inp)break;
      var st=parseFloat(inp.step)||1,v=(parseFloat(inp.value)||0)+st*parseInt(d.d,10),mn=parseFloat(inp.min),mx=parseFloat(inp.max);
      v=clamp(v,mn,mx);inp.value=+v.toFixed(2);inp.dispatchEvent(new Event('change',{bubbles:true}));break;
    }
    case 'addwater':addWater(S.settings.glass);break;
    case 'undowater':{
      var l=S.water.filter(function(x){return sameDay(x.t,dkey())}).sort(function(x,y){return y.t-x.t})[0];
      if(l){S.water=S.water.filter(function(x){return x.id!==l.id});save();toast('Removed '+l.ml+' ml');render()}else toast('Nothing to undo');break;
    }
    case 'setglass':S.settings.glass=parseInt(d.v,10);save();render();break;
    case 'remtoggle':
      S.settings.remOn=!S.settings.remOn;S.nextRem=S.settings.remOn?Date.now()+S.settings.remMin*60000:0;save();
      if(S.settings.remOn){try{if('Notification' in window&&Notification.permission==='default')Notification.requestPermission()}catch(x){}}
      render();break;
    case 'togglesound':S.settings.sound=!S.settings.sound;save();render();break;
    case 'watercfg':waterCfg();break;
    case 'setint':
      S.settings.remMin=parseInt(d.v,10);S.nextRem=S.settings.remOn?Date.now()+S.settings.remMin*60000:0;save();render();
      if(!$('#sheet').hidden)waterCfg();break;
    case 'setsound':S.settings.sound=d.v==='1';save();render();waterCfg();break;
    case 'savewatercfg':S.goals.water=clamp(parseInt($('#wc_goal').value,10)||2500,500,6000);save();closeSheet();render();toast('Saved');break;
    case 'bannerAdd':$('#banner').hidden=true;addWater(S.settings.glass);break;
    case 'bannerClose':$('#banner').hidden=true;break;
    case 'wtype':ui.wtype=d.v;render();break;
    case 'startactive':startActive(d.k);break;
    case 'cancelactive':S.active=null;save();render();toast('Session cancelled');break;
    case 'finish':finishSheet(d.k,false);break;
    case 'manual':if(S.active){toast('Finish your current session first');break}finishSheet(d.k,true);break;
    case 'savefinish':{
      var kind=d.k,min=clamp(parseFloat($('#f_min').value)||1,1,600),now=Date.now();
      if(kind==='workout'){
        S.workouts.push({id:uid(),t:now,type:d.type||ui.wtype,min:Math.round(min),cal:Math.max(0,Math.round(parseFloat($('#f_cal').value)||0))});
      }else{
        var km=clamp(parseFloat($('#f_km').value)||0.1,0.1,300);
        S.sessions.push({id:uid(),t:now,kind:kind,km:Math.round(km*10)/10,sec:Math.round(min*60)});
      }
      if(d.manual!=='1')S.active=null;
      save();closeSheet();render();toast('Saved');break;
    }
    case 'viewall':viewAll(d.k);break;
    case 'delitem':
      S[d.c]=S[d.c].filter(function(x){return x.id!==d.id});save();
      if(d.c==='bp')bpDraft=null;
      render();if(d.keep)viewAll(d.keep);
      toast('Deleted');break;
    case 'bpstep':{
      var kk=d.k,bd=bpDraft,lim={sys:[50,260],dia:[30,160],pulse:[30,220]}[kk];
      bd[kk]=clamp(bd[kk]+parseInt(d.d,10),lim[0],lim[1]);render();break;
    }
    case 'savebp':
      S.bp.push({id:uid(),t:Date.now(),sys:bpDraft.sys,dia:bpDraft.dia,pulse:bpDraft.pulse});save();
      toast('Reading saved');render();break;
    case 'savesleep':S.sleep[dkey()]={h:clamp(parseFloat($('#sl_h').value)||0,0,16)};save();toast('Sleep saved');render();break;
    case 'addmeal':S.meals.push({id:uid(),t:Date.now(),cal:parseInt(d.v,10)});save();toast('+'+d.v+' kcal');render();break;
    case 'addmealc':S.meals.push({id:uid(),t:Date.now(),cal:clamp(parseInt($('#ml_c').value,10)||0,10,3000)});save();toast('Meal added');render();break;
    case 'savesteps':S.steps.push({id:uid(),t:Date.now(),n:clamp(parseInt($('#st_n').value,10)||0,0,50000)});save();closeSheet();toast('Steps added');render();break;
    case 'editgoals':goalsSheet();break;
    case 'savegoals':
      S.goals={steps:clamp(parseInt($('#g_steps').value,10)||8000,1000,40000),water:clamp(parseInt($('#g_water').value,10)||2500,500,6000),cal:clamp(parseInt($('#g_cal').value,10)||400,50,3000),sleep:clamp(parseFloat($('#g_sleep').value)||8,4,12)};
      save();closeSheet();render();toast('Goals saved');break;
    case 'range':ui.range=parseInt(d.v,10);render();break;
    case 'metric':ui.metric=d.v;render();break;
    case 'rmsample':removeSample();toast('Sample data removed');render();break;
    case 'resetall':
      if(!ui.confirmReset){ui.confirmReset=true;render();setTimeout(function(){ui.confirmReset=false;if(cur()==='profile')render()},4000)}
      else{try{localStorage.removeItem(KEY)}catch(x){}var keepSeed=false;S=seed();removeSample();S.sleep={};ui.confirmReset=false;bpDraft=null;save();toast('All data erased');render()}
      break;
  }
});
document.addEventListener('change',function(e){
  var el=e.target;
  if(el.dataset&&el.dataset.bp){
    var lim={sys:[50,260],dia:[30,160],pulse:[30,220]}[el.dataset.bp];
    bpDraft[el.dataset.bp]=clamp(Math.round(parseFloat(el.value))||lim[0],lim[0],lim[1]);render();return;
  }
  if(el.dataset&&el.dataset.prof){
    var k=el.dataset.prof;
    if(k==='name')S.profile.name=(el.value||'').trim().slice(0,20)||'Athlete';
    else{var mn=parseFloat(el.min),mx=parseFloat(el.max);S.profile[k]=clamp(parseFloat(el.value)||mn,mn,mx)}
    save();render();
  }
});
window.addEventListener('hashchange',function(){ui.anim=cur()==='home';render();window.scrollTo(0,0)});

setInterval(function(){
  var now=Date.now(),c=$('#clock');
  if(c&&S.active)c.textContent=fmtDur((now-S.active.start)/1000);
  if(S.settings.remOn){
    if(!S.nextRem){S.nextRem=now+S.settings.remMin*60000;save()}
    if(now>=S.nextRem)fireRem();
    var rt=$('#remtxt');if(rt)rt.textContent=remText();
  }
},1000);

/* ---------- start ---------- */
S=load();
if(!S){S=seed();save()}
navInit();
render();
})();
</script>

</body></html>
